plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.liveclass'
version = '0.0.1-SNAPSHOT'
description = 'creator-settlement'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/**/*.java'
        targetExclude '**/build/**', '**/generated/**'
        googleJavaFormat('1.22.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        toggleOffOn()
    }
}

// ./gradlew build 시 spotlessCheck 자동 실행
tasks.named('check').configure {
    dependsOn 'spotlessCheck'
}

// Git pre-commit/pre-push 훅을 .git/hooks 로 복사 설치
tasks.register('installGitHooks', Copy) {
    description = 'scripts/git-hooks 의 훅들을 .git/hooks 로 복사한다.'
    group = 'git hooks'
    from "${rootDir}/scripts/git-hooks"
    into "${rootDir}/.git/hooks"
    filePermissions {
        unix('rwxr-xr-x')
    }
}

// build 시점에 훅도 자동 설치 (한 번만 수동 실행도 가능: ./gradlew installGitHooks)
tasks.named('build').configure {
    dependsOn 'installGitHooks'
}
